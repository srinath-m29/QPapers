<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — QPapers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>
<body class="auth-page admin-auth-page">

<div class="admin-login-wrap">
  <div class="admin-login-card">

    <div class="admin-login-header">
      <div class="admin-shield-icon"><i class="bi bi-shield-lock-fill"></i></div>
      <h2>Admin Portal</h2>
      <p>Restricted access — authorised personnel only</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show qp-alert mb-3" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_login') }}" class="qp-form">
      <div class="form-group-qp">
        <label for="username"><i class="bi bi-person-fill-gear"></i> Admin Username</label>
        <input type="text" class="form-control qp-input" id="username"
               name="username" placeholder="admin" required autocomplete="username" />
      </div>
      <div class="form-group-qp">
        <label for="password"><i class="bi bi-key-fill"></i> Password</label>
        <div class="input-pw-wrap">
          <input type="password" class="form-control qp-input" id="password"
                 name="password" placeholder="••••••••" required />
          <button type="button" class="pw-toggle" onclick="togglePw('password', this)">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-admin-login w-100 mt-3">
        <i class="bi bi-shield-check me-2"></i>Access Admin Panel
      </button>
    </form>

    <div class="admin-back-link mt-4 text-center">
      <a href="{{ url_for('student_login') }}">
        <i class="bi bi-arrow-left"></i> Back to Student Login
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
